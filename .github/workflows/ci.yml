name: CI

on:
  pull_request:
    branches: [main, 'sprint/**']
  push:
    branches: [main, 'sprint/**', 'ci/**', 'feature/**', 'fix/**', 'build/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Both databases live only inside this job's disposable PostgreSQL service.
      CI_TEST_DATABASE_URL: postgresql://pewdiy_ci@127.0.0.1:5432/pewdiy_ci_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pewdiy_ci
          POSTGRES_DB: pewdiy_ci_test
          # Disposable runner-only database; no production credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U pewdiy_ci -d pewdiy_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --no-audit
          npm --prefix client ci --no-audit
      - name: Provision isolated migration-repair database
        run: psql "$CI_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE pewdiy_migration_repair_test'
      - name: Install Chromium and Linux dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Build, typecheck and run all regression suites
        run: npm run test:ci
        env:
          NODE_ENV: test
          CI_TEST_DATABASE_URL: postgresql://pewdiy_ci@127.0.0.1:5432/pewdiy_ci_test
          MIGRATION_TEST_DATABASE_URL: postgresql://pewdiy_ci@127.0.0.1:5432/pewdiy_migration_repair_test
      - name: Upload sanitized test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14

  docker-image:
    name: Docker image build and readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pewdiy_ci
          POSTGRES_DB: pewdiy_ci_test
          # Disposable runner-only database; no production credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U pewdiy_ci -d pewdiy_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the root application image (C-03)
        run: docker build --tag pewdiy:ci .
      - name: Run the image against the database and prove readiness
        run: |
          docker run --detach --name pewdiy-ci --network host \
            --env NODE_ENV=production \
            --env PORT=3000 \
            --env APP_ORIGIN=http://127.0.0.1:3000 \
            --env DATABASE_URL=postgresql://pewdiy_ci@127.0.0.1:5432/pewdiy_ci_test \
            --env SESSION_IDLE_MINUTES=60 \
            --env SESSION_ABSOLUTE_MINUTES=480 \
            --env SESSION_COOKIE_NAME=pew_session \
            --env SESSION_COOKIE_SECURE=false \
            --env APP_TIMEZONE=Asia/Bangkok \
            pewdiy:ci

          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/api/ready; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Container never became ready"
            docker logs pewdiy-ci
            exit 1
          fi
          curl --silent --fail --output /dev/null http://127.0.0.1:3000/login
          echo "PASS container readiness and SPA shell"
      - name: Prove no environment secret was baked into the image
        run: |
          if docker run --rm pewdiy:ci sh -c 'test -e /app/.env'; then
            echo "A .env file was baked into the image"
            exit 1
          fi
          echo "PASS no .env inside the image"
      - name: Container logs
        if: ${{ !cancelled() }}
        run: docker logs pewdiy-ci || true
      - name: Stop the container
        if: ${{ always() }}
        run: docker rm --force pewdiy-ci || true
