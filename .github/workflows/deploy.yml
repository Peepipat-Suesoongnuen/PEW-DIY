# ##############################################################################
# Deploy demo — automatic deployment to Google Cloud Run
# ##############################################################################
# WHAT THIS WORKFLOW DOES
#   On every push to `main` it:
#     1) runs the CI workflow (ci-docker.yml, job `test-and-docker`) first,
#     2) authenticates to Google Cloud WITHOUT a key file (Workload Identity
#        Federation),
#     3) builds + pushes the image tagged with the commit SHA,
#     4) runs deploy/release.sh (verify image -> migrate -> update service),
#     5) smoke-tests the public URL (deploy/smoke_test.py),
#     6) writes a deployment summary.
#   A manual run deploys an already-published image by full commit SHA. It does
#   not run CI, build, migration or seed; this supports Episode 8 rollback and
#   roll-forward without changing the database.
#
# ⚠️ DO NOT RENAME (the lab guide refers to these names):
#   - job `test-and-docker` (defined in ci-docker.yml, called by `test` below)
#   - environment : demo
#   - repository/environment variables: GCP_PROJECT_ID, GCP_REGION,
#     WIF_PROVIDER, WIF_SERVICE_ACCOUNT
#
# ⭐ IMPORTANT
#   - Nothing secret lives in this file. Values come from GitHub
#     Settings -> Environments -> demo (variables) and secrets.
#   - Optional login smoke test: variable SMOKE_USERNAME + secret SMOKE_PASSWORD
#     (set both or neither).
#   - The cloud resources (Cloud SQL, secrets, service account, Artifact
#     Registry, Cloud Run service/job) must already exist: create them once with
#     deploy/deploy.sh. This workflow only UPDATES them.
#
# REFERENCES
#   - Workflow syntax / reusable workflows:
#       https://docs.github.com/en/actions/sharing-automations/reusing-workflows
#   - Environments (demo): https://docs.github.com/en/actions/managing-workflow-runs-and-deployments/managing-deployments/managing-environments-for-deployment
#   - Variables: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/store-information-in-variables
#   - Keyless auth to GCP (Workload Identity Federation):
#       https://github.com/google-github-actions/auth
#       https://cloud.google.com/iam/docs/workload-identity-federation
#   - setup-gcloud : https://github.com/google-github-actions/setup-gcloud
#   - Cloud Run deploy / rollback:
#       https://cloud.google.com/run/docs/deploying
#       https://cloud.google.com/run/docs/rollouts-rollbacks-traffic-migration
#   - Concurrency: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
#
# ⭐ CHANGE ME — groups using another tech stack must edit (marked below):
#   # PEW-DIY resources: service pewdiy, migration job pewdiy-migrate, image pewdiy/pewdiy
#   # CHANGE ME: build step if your image is not built from the root Dockerfile
#   # CHANGE ME: Python setup + smoke test if you use another smoke test
# ##############################################################################

name: Deploy demo

# ------------------------------------------------------------------------------
# Trigger: automatic release on main, or manual deployment of an existing image.
# ------------------------------------------------------------------------------
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Full 40-character commit SHA of an image already in Artifact Registry'
        required: true
        type: string

# Least privilege by default; the deploy job adds `id-token: write` below.
permissions:
  contents: read

# Queue releases; do not interrupt a running migration or deployment. Keep up
# to 100 pending releases so a newer push cannot replace an earlier pending run.
concurrency:
  group: deploy-demo
  cancel-in-progress: false
  queue: max

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: run the CI workflow (which exposes the required test-and-docker job).
  # ----------------------------------------------------------------------------
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci-docker.yml

  # ----------------------------------------------------------------------------
  # Job 2: automatic run builds/migrates; manual run reuses an existing image.
  # Push deployments require successful CI; manual deployments skip that job.
  # ----------------------------------------------------------------------------
  deploy:
    needs: test
    # Manual image-only deployments intentionally skip the reusable CI job.
    # `always()` is needed because `needs.test` is skipped for workflow_dispatch.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.test.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ⚠️ Do not rename: GitHub environment holding the GCP variables/secrets.
    environment: demo
    permissions:
      contents: read
      id-token: write # required for keyless Google Cloud login (WIF)
    env:
      # ⚠️ Variable names GCP_PROJECT_ID / GCP_REGION must not change.
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      # CHANGE ME: names of your Cloud Run service and migration job.
      SERVICE_NAME: pewdiy
      MIGRATE_JOB_NAME: pewdiy-migrate
      # Automatic releases use the triggering commit; manual runs select an
      # existing image by its full commit SHA.
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}
      # Manual runs deploy an existing image only: no migration or seed.
      ROLLBACK: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      # ------------------------------------------------------------------------
      # 1. Get the source code (no git credentials kept on the runner)
      # ------------------------------------------------------------------------
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ------------------------------------------------------------------------
      # 2. Fail early if settings are missing or the tag is not a full SHA
      #    ⚠️ Variable names WIF_PROVIDER / WIF_SERVICE_ACCOUNT must not change.
      # ------------------------------------------------------------------------
      - name: Validate deployment settings
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROJECT_ID" && test -n "$REGION"
          test -n "$WIF_PROVIDER" && test -n "$WIF_SERVICE_ACCOUNT"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual image deployments are allowed only from the main branch.' >&2
            exit 1
          fi
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'Image tag must be a full 40-character commit SHA.'; exit 1; }

      # ------------------------------------------------------------------------
      # 3. Log in to Google Cloud with Workload Identity Federation (no key file)
      #    ⭐ IMPORTANT: this is why no service-account JSON is stored in GitHub.
      # ------------------------------------------------------------------------
      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # ------------------------------------------------------------------------
      # 4. Build and push only for automatic releases. Manual runs must reuse
      #    the already-published image selected by image_tag.
      #    PEW-DIY image path `.../pewdiy/pewdiy` must match the
      #    Artifact Registry repo and service names (see deploy/release.sh).
      # ------------------------------------------------------------------------
      - name: Build and push image
        if: github.event_name == 'push'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/pewdiy/pewdiy:$IMAGE_TAG"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      # ------------------------------------------------------------------------
      # 5. Verify image -> (automatic release only: migrate) -> update service.
      #    All logic lives in deploy/release.sh; exports SERVICE_URL and
      #    DEPLOYED_IMAGE for the next steps.
      # ------------------------------------------------------------------------
      - name: Verify image and deploy (migration only for automatic release)
        run: bash deploy/release.sh

      # ------------------------------------------------------------------------
      # 6. Smoke test the live URL
      #    CHANGE ME: Python setup + script if you use another smoke test.
      # ------------------------------------------------------------------------
      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Smoke test public URL
        env:
          # Optional login check: set BOTH (variable + secret) or neither.
          SMOKE_USERNAME: ${{ vars.SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python3 deploy/smoke_test.py "$SERVICE_URL"

      # ------------------------------------------------------------------------
      # 7. Deployment summary shown on the workflow run page
      # ------------------------------------------------------------------------
      - name: Record deployment
        run: |
          {
            echo '### PEW-DIY demo deployment'
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- Digest: \`$DEPLOYED_IMAGE\`"
            echo "- URL: $SERVICE_URL"
            if [[ "$ROLLBACK" == true ]]; then
              echo '- Mode: existing image deployment (build, migration and seed skipped).'
            else
              echo '- Mode: automatic release (build and migration completed).'
            fi
            echo '- Smoke test: passed (database readiness, SPA page and anonymous authorization).'
            echo '- See smoke step for optional login check status.'
          } >> "$GITHUB_STEP_SUMMARY"
